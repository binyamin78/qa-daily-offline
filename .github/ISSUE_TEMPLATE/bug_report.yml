name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → bottom of the screen
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 17, Pixel 9"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Form, Report text, Today dashboard, Insights / charts, Weekly summary, History, Reminders, Settings, Other]
  - type: textarea
    id: report
    attributes:
      label: Report text or screenshot
      description: Paste the generated report or attach a screenshot if relevant. Remove anything confidential.
